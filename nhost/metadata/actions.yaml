actions:
  - name: approveStep
    definition:
      arguments:
        - name: step_run_id
          type: uuid!
      handler: https://lxurpouvxelcvrbqpbxk.functions.eu-central-1.nhost.run/v1/approveStep
      ignored_client_headers:
        - Content-Length
        - Content-MD5
        - User-Agent
        - Host
        - Origin
        - Referer
        - Accept
        - Accept-Encoding
        - Accept-Language
        - Accept-Datetime
        - Cache-Control
        - Connection
        - DNT
        - Content-Type
      kind: synchronous
      output_type: ApprovalResult
      type: mutation
    permissions:
      - role: user
    comment: approveStep

  - name: triggerWorkflowRun
    definition:
      arguments:
        - name: workflow_id
          type: uuid!
      handler: https://lxurpouvxelcvrbqpbxk.functions.eu-central-1.nhost.run/v1/triggerWorkflowRun
      ignored_client_headers:
        - Content-Length
        - Content-MD5
        - User-Agent
        - Host
        - Origin
        - Referer
        - Accept
        - Accept-Encoding
        - Accept-Language
        - Accept-Datetime
        - Cache-Control
        - Connection
        - DNT
        - Content-Type
      kind: synchronous
      output_type: WorkflowRunResult
      type: mutation
    permissions:
      - role: user
    comment: triggerWorkflowRun
