- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        connection_lifetime: 600
        idle_timeout: 180
        max_connections: 50
        retries: 1
      use_prepared_statements: true
  tables:
    - "!include default/tables/public_organizations.yaml"
    - "!include default/tables/public_org_members.yaml"
    - "!include default/tables/public_workflows.yaml"
    - "!include default/tables/public_workflow_steps.yaml"
    - "!include default/tables/public_workflow_triggers.yaml"
    - "!include default/tables/public_workflow_runs.yaml"
    - "!include default/tables/public_step_runs.yaml"
    - "!include default/tables/public_organization_usage.yaml"
