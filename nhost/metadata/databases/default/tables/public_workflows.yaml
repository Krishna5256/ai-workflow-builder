table:
  name: workflows
  schema: public
object_relationships:
- name: organization
  using:
    foreign_key_constraint_on: org_id
array_relationships:
- name: workflow_runs
  using:
    foreign_key_constraint_on:
      column: workflow_id
      table:
        name: workflow_runs
        schema: public
- name: workflow_steps
  using:
    foreign_key_constraint_on:
      column: workflow_id
      table:
        name: workflow_steps
        schema: public
- name: workflow_triggers
  using:
    foreign_key_constraint_on:
      column: workflow_id
      table:
        name: workflow_triggers
        schema: public
insert_permissions:
- role: user
  permission:
    check:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    columns:
    - description
    - name
    - org_id
  comment: ''
select_permissions:
- role: user
  permission:
    columns:
    - description
    - name
    - created_at
    - updated_at
    - id
    - org_id
    filter:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  comment: ''
update_permissions:
- role: user
  permission:
    columns:
    - description
    - name
    filter:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    check: null
  comment: ''
delete_permissions:
- role: user
  permission:
    filter:
      organization:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  comment: ''
